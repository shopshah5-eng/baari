version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: baari
      POSTGRES_PASSWORD: baari_dev_password
      POSTGRES_DB: baari
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro

  engine:
    build:
      context: .
      dockerfile: apps/engine/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://baari:baari_dev_password@postgres:5432/baari
      STORE: sql
      AUTH_REQUIRED: "true"
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      ADMIN_KEY: ${ADMIN_KEY:-admin-secret}
      UPI_VPA: ${UPI_VPA:-baari@okaxis}
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      ENGINE_URL: http://engine:3000
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
    ports:
      - "3001:3001"
    depends_on:
      - engine

volumes:
  pgdata:

