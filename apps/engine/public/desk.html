<!doctype html><html lang="hi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baari — Reception Desk</title><link rel="stylesheet" href="/assets/app.css">
<style>
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
  .pv{display:flex;flex-direction:column;min-height:340px;overflow:hidden}
  .pv-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .pv-head h3{font-size:15px}
  .now{background:linear-gradient(135deg,#0B7A6B,#0E8E7C);color:#fff;padding:16px;display:flex;align-items:center;gap:14px}
  .now .tk{font-size:38px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
  .now .lbl{font-size:11px;font-weight:800;letter-spacing:.1em;opacity:.85;text-transform:uppercase}
  .now.idle{background:var(--mint);color:var(--teal-d)}
  .q{flex:1;overflow:auto;max-height:300px}
  .qi{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);font-size:14px}
  .qi:last-child{border-bottom:0}
  .qi .n{font-weight:800;font-variant-numeric:tabular-nums;color:var(--teal-d);min-width:52px}
  .qi .who{flex:1;min-width:0}
  .qi .who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qi .who span{font-size:12px;color:var(--grey)}
  .qi .eta{font-size:12px;font-weight:700;color:var(--amber-d);text-align:right;white-space:nowrap}
  .qi.em{background:#FDF3F3}
  .empty{padding:26px 16px;color:var(--grey);font-size:13.5px;text-align:center}
  .dock{position:sticky;bottom:0;background:rgba(251,248,242,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);margin-top:14px;padding:12px 0}
  .dock .row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:10px}
  .dock .btn{height:62px;font-size:15px;flex-direction:column;gap:2px}
  .dock .btn small{font-size:11px;font-weight:600;opacity:.8}
  .ticker{display:flex;gap:16px;font-size:12.5px;color:var(--grey);font-weight:600;flex-wrap:wrap}
  .ticker b{color:var(--ink)}
  @media(max-width:820px){.dock .row{grid-template-columns:1fr 1fr;}.dock .btn{height:56px;font-size:14px}}
</style></head><body>
<div id="nav"></div>
<div class="wrap">
  <div class="row" style="align-items:center;margin-bottom:12px">
    <div>
      <h1 style="font-size:22px">Reception <span class="muted" id="date"></span></h1>
      <div class="ticker" id="ticker"></div>
    </div>
    <div class="spacer"></div>
    <button class="pill live" id="wa" onclick="waPanel()" style="cursor:pointer;border:0">🟢 WhatsApp</button>
    <button class="btn btn-ghost btn-sm" onclick="undo()">↩︎ Undo</button>
  </div>
  <div class="cols" id="cols"></div>
  <div class="dock"><div class="wrap"><div class="row">
    <button class="btn btn-primary" onclick="callFor(selected)">✅ Call Next<small id="callForLabel">—</small></button>
    <button class="btn btn-ghost" onclick="addWalkin()">➕ Add Walk-in<small>Naya patient</small></button>
    <button class="btn btn-red" onclick="emergency()">🚨 Emergency<small>Sabse pehle</small></button>
    <button class="btn btn-amber" onclick="delay()">⏸ +15 min<small>Doctor late</small></button>
    <button class="btn btn-ghost" onclick="location.href='/tv?t='+SLUG">📺 TV<small>Display</small></button>
  </div></div></div>
</div>
<script src="/assets/api.js"></script>
<script>
let S = null, selected = null, live = false;
document.getElementById('nav').innerHTML = nav('desk');
document.getElementById('date').textContent = new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short'});

function paint(){
  if(!S) return;
  if(!selected) selected = S.providers[0].id;
  document.getElementById('callForLabel').textContent = (S.providers.find(p=>p.id===selected)?.name.split(' ').slice(-1)[0]) || '—';
  const wa = document.getElementById('wa');
  wa.textContent = (S.org.wa.status==='connected'?'🟢':'🟠') + ' WhatsApp · ' + (S.org.wa.lane||'mock') + (live?' ⚡':'');
  wa.className = 'pill ' + (S.org.wa.status==='connected'?'live':'warn');
  document.getElementById('ticker').innerHTML = `
    <span>Aaj: <b>${S.today.total}</b> token</span><span>Done: <b>${S.today.done}</b></span>
    <span>Waiting: <b>${S.today.waiting}</b></span><span>Collected: <b>₹${S.revenue.collected}</b></span>
    <span>Reviews: <b>${S.reviewStats.avg ? S.reviewStats.avg+'★' : '—'}</b></span>
    <span>Lab: <b>${S.lab.pending_reports} pending</b></span>`;
  document.getElementById('cols').innerHTML = S.providers.map(p=>{
    const on = p.id===selected;
    return `<div class="card pv" style="${on?'outline:2px solid var(--teal);outline-offset:2px':''}" onclick="selected='${p.id}';paint()">
      <div class="pv-head"><h3>${p.name}</h3><span class="pill">${p.room||''}</span><div class="spacer"></div><span class="muted">${p.done} done</span></div>
      ${p.current
        ? `<div class="now"><div><div class="lbl">Now serving</div><div class="tk">${p.current.label}</div></div>
            <div style="flex:1"><div style="font-weight:700">${p.current.name}</div>
            <div style="opacity:.85;font-size:12.5px">${p.current.state==='CALLED'?'Called — waiting to enter':'In consultation'}</div></div>
            <button class="btn btn-amber btn-sm" onclick="event.stopPropagation();done('${p.current.id}')">Done ✓</button></div>`
        : `<div class="now idle"><div><div class="lbl">Now serving</div><div class="tk" style="font-size:26px">—</div></div>
            <div style="flex:1;font-size:13.5px;font-weight:600">Koi patient nahi</div></div>`}
      <div class="q">${p.waiting.length ? p.waiting.map(t=>`
        <div class="qi ${t.priority===0?'em':''}">
          <span class="n"><a href="/status?id=${t.id}" target="_blank" style="color:inherit;text-decoration:underline dotted">${t.label}</a></span>
          <span class="who"><b>${t.name||'Walk-in'}</b><span>${t.reason||''}</span></span>
          <span class="eta">${t.ahead===0?'abhi':'~'+t12(t.eta)}</span>
          <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();act('${t.id}','skip')" title="Skip">⏭</button>
        </div>`).join('') : '<div class="empty">Line khali hai — patient aaye to ➕ Add dabayein</div>'}
      </div>
      <div style="padding:10px 16px;border-top:1px solid var(--line)">
        <button class="btn btn-primary btn-block btn-sm" onclick="event.stopPropagation();callFor('${p.id}')">✅ Call Next — ${p.name.split(' ').slice(-1)[0]}</button>
      </div></div>`;
  }).join('');
}
async function load(){ S = await api('/state'); paint(); }

/* live updates over SSE, silent fallback to polling */
function connect(){
  try{
    const es = new EventSource('/api/'+SLUG+'/stream');
    es.addEventListener('state', e=>{ S = JSON.parse(e.data); live = true; paint(); });
    es.onerror = ()=>{ live = false; es.close(); setTimeout(connect, 4000); };
  }catch(e){ live = false; }
}

async function callFor(id){ selected=id; await api('/call/'+id,{method:'POST'}); toast('📢 Bulaya gaya — TV + WhatsApp dono update'); load(); }
async function act(id,a){ await api('/token/'+id+'/'+a,{method:'POST'}); load(); }
async function done(id){ const r=await api('/token/'+id+'/done',{method:'POST'}); toast(r.learned?`✅ Done · learning: asli ${r.learned.actual} min (avg ${r.learned.ewma})`:'✅ Done'); load(); }

function sheet(html){ let m=document.getElementById('sheet');
  if(!m){ m=document.createElement('div'); m.id='sheet'; document.body.appendChild(m); }
  m.innerHTML = `<div style="position:fixed;inset:0;background:rgba(15,30,27,.45);z-index:60;display:grid;place-items:end center" onclick="if(event.target===this)closeSheet()">
    <div style="background:#fff;width:100%;max-width:460px;border-radius:20px 20px 0 0;padding:20px;box-shadow:0 -10px 40px rgba(0,0,0,.2)">${html}</div></div>`;
}
function closeSheet(){ const m=document.getElementById('sheet'); if(m) m.innerHTML=''; }

async function addWalkin(){
  const prov = S.providers.find(p=>p.id===selected) || S.providers[0];
  sheet(`<h3 style="font-size:17px;margin-bottom:4px">➕ Add Walk-in</h3>
    <div class="muted" style="margin-bottom:12px">${prov.name} · ${prov.room||''}</div>
    <label>Naam</label><input id="w-name" placeholder="Ritu Sharma">
    <div style="height:10px"></div><label>Phone (WhatsApp alert — optional)</label><input id="w-phone" placeholder="98xxxxxxxx" inputmode="numeric">
    <div style="height:10px"></div><label>Kaam kya hai?</label><input id="w-reason" placeholder="tooth pain / cleaning">
    <div class="row" style="margin-top:16px">
      <button class="btn btn-primary" style="flex:1" onclick="doWalkin()">🎫 Token banao</button>
      <button class="btn btn-ghost" onclick="closeSheet()">Cancel</button></div>`);
  setTimeout(()=>document.getElementById('w-name')?.focus(),50);
}
async function doWalkin(){
  const name = document.getElementById('w-name').value.trim() || 'Walk-in';
  let phone = document.getElementById('w-phone').value.replace(/\D/g,'');
  const reason = document.getElementById('w-reason').value.trim();
  const r = await api('/walkin',{method:'POST',body:{name, phone: phone||undefined, provider_id:selected, reason:reason||'walk-in'}});
  closeSheet(); toast('🎫 '+r.token.label+' — '+r.token.provider); load();
}
function emergency(){
  const prov = S.providers.find(p=>p.id===selected) || S.providers[0];
  sheet(`<h3 style="font-size:17px">🚨 Emergency jump?</h3>
    <p class="muted">${prov.name} ki line me sabse aage, aur ${prov.waiting.length} waiting patients ko 10 min delay ka message jayega.</p>
    <div class="row"><button class="btn btn-red" style="flex:1" onclick="doEmergency()">Haan, emergency</button>
    <button class="btn btn-ghost" onclick="closeSheet()">Cancel</button></div>`);
}
async function doEmergency(){ closeSheet(); const r=await api('/emergency',{method:'POST',body:{provider_id:selected}}); toast(`🚨 ${r.label} — ${r.affected} patients ko message`); load(); }
function delay(){
  const prov = S.providers.find(p=>p.id===selected) || S.providers[0];
  sheet(`<h3 style="font-size:17px">⏸ Doctor delayed</h3>
    <p class="muted">${prov.name} · ${prov.waiting.length} patients ko naya samay jayega</p>
    <div class="row"><button class="btn btn-amber" style="flex:1" onclick="doDelay(15)">+15 min</button>
    <button class="btn btn-amber" style="flex:1" onclick="doDelay(30)">+30 min</button></div>
    <div style="height:10px"></div><button class="btn btn-ghost btn-block" onclick="closeSheet()">Cancel</button>`);
}
async function doDelay(m){ closeSheet(); const r=await api('/delay',{method:'POST',body:{provider_id:selected,minutes:m}}); toast('⏸ '+r.affected+' patients ko delay message chala gaya'); load(); }

/* WhatsApp connection panel with live QR */
async function waPanel(){
  const st = await fetch('/api/'+SLUG+'/wa/status').then(r=>r.json());
  sheet(`<h3 style="font-size:17px;margin-bottom:4px">WhatsApp connect</h3>
    <div class="muted" style="margin-bottom:12px">Clinic ke phone se WhatsApp → Linked devices → QR scan</div>
    <div class="row" style="align-items:center"><span class="pill ${st.status==='connected'?'live':'warn'}">${st.status}</span>
      <span class="muted">lane: ${st.lane} · aaj ${st.messages_today} messages</span></div>
    <div id="qrbox" class="center" style="height:200px;margin:12px 0;background:var(--paper);border-radius:12px">${
      st.status==='connected' ? '<div class="pill live">✓ Connected — kuch karne ki zarurat nahi</div>'
      : '<span class="muted">QR laane ke liye "Connect" dabayein</span>'}</div>
    <div class="row">
      <button class="btn btn-primary" style="flex:1" onclick="waConnect()">Connect / naya QR</button>
      <button class="btn btn-ghost" onclick="waLogout()">Disconnect</button></div>
    <div class="hr"></div>
    <div class="tiny">Official Meta API lane (optional)</div>
    <div class="row" style="margin-top:8px">
      <input id="meta-pnid" placeholder="phone_number_id" style="flex:1">
      <input id="meta-token" placeholder="access token" style="flex:1"></div>
    <button class="btn btn-ghost btn-block btn-sm" style="margin-top:8px" onclick="saveMeta()">Meta lane save karein</button>`);
  if(st.status==='connected') return;
  const es = new EventSource('/api/'+SLUG+'/wa/qr');
  es.addEventListener('qr', async e => {
    const { qr } = JSON.parse(e.data);
    const img = await fetch('/api/'+SLUG+'/wa/qr.png?d='+encodeURIComponent(qr)).then(r=>r.text()).catch(()=>null);
    document.getElementById('qrbox').innerHTML = `<img src="/api/${SLUG}/wa/qr.png?d=${encodeURIComponent(qr)}" width="180" height="180" alt="QR">`;
  });
  es.addEventListener('status', e => { const d=JSON.parse(e.data); if(d.status==='connected'){ document.getElementById('qrbox').innerHTML='<div class="pill live">✓ Connected</div>'; es.close(); } });
  setTimeout(()=>es.close(), 125000);
}
async function waConnect(){
  const r = await fetch('/api/'+SLUG+'/wa/connect',{method:'POST'}).then(x=>x.json());
  if(!r.ok) toast('Baileys lane: '+r.reason+' — mock lane chal raha hai');
  else toast('QR aa raha hai…');
}
async function waLogout(){ await fetch('/api/'+SLUG+'/wa/logout',{method:'POST'}); toast('Disconnect ho gaya'); closeSheet(); load(); }
async function saveMeta(){
  const phone_number_id=document.getElementById('meta-pnid').value.trim();
  const token=document.getElementById('meta-token').value.trim();
  const r = await fetch('/api/'+SLUG+'/wa/meta',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({phone_number_id,token})}).then(x=>x.json());
  toast(r.ok?'✅ Meta lane saved':'fail');
}
async function undo(){ const r=await api('/undo',{method:'POST'}); toast(r.ok?'↩︎ Undo ho gaya':'Kuch undo karne ko nahi'); load(); }

load(); connect(); setInterval(load, 20000);
</script></body></html>
