version: "3.9"
services:
  baari:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
    volumes:
      - baari-data:/app/data
    expose: ["3000"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [baari]

  # optional: Postgres for STORE=sql (comment out to stay on the JSON store)
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: baari
      POSTGRES_USER: baari
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-baari_dev}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baari"]
      interval: 10s

volumes:
  baari-data:
  caddy-data:
  caddy-config:
  pgdata:
